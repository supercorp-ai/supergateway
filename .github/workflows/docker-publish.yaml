name: Stage release candidate

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish tested candidate images (never stable aliases)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run stage:release
      - name: Candidate identity
        id: identity
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version}=JSON.parse(fs.readFileSync(".release/manifest.json")); if (!/^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/.test(version)) throw Error("Invalid version"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${version}-candidate-${process.env.GITHUB_RUN_ID}\n`);'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate
          path: .release/
          include-hidden-files: true

  package:
    needs: stage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.0.0', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: .release
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Save consumer runtime
        shell: bash
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path"); fs.appendFileSync(process.env.GITHUB_ENV,"SUPERGATEWAY_TEST_NODE="+process.execPath+"\nSUPERGATEWAY_TEST_NPM="+p.resolve(p.dirname(process.execPath),process.platform==="win32"?"node_modules/npm/bin/npm-cli.js":"../lib/node_modules/npm/bin/npm-cli.js")+"\n")'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:package
        env:
          SUPERGATEWAY_PACKAGE_MANIFEST: .release/manifest.json

  images:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: .release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - name: Build and exercise every variant
        run: node --import tsx --test tests/dockerImages.test.ts
        env:
          RUN_DOCKER_TESTS: '1'
          DOCKER_TEST_PLATFORM: linux/${{ matrix.arch }}
      - name: Save the tested images
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save "supergateway-test-linux-$ARCH:base" "supergateway-test-linux-$ARCH:uvx" "supergateway-test-linux-$ARCH:deno" -o images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.arch }}
          path: images.tar
          compression-level: 0

  publish-architecture:
    if: inputs.publish_images
    needs: [stage, package, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ matrix.arch }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested bytes under candidate-only tags
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.stage.outputs.tag }}
        run: |
          docker load -i images.tar
          for registry in supercorp/supergateway ghcr.io/supercorp-ai/supergateway; do
            for variant in base uvx deno; do
              suffix="-$variant"; test "$variant" != base || suffix=""
              destination="$registry:$TAG$suffix-$ARCH"
              docker tag "supergateway-test-linux-$ARCH:$variant" "$destination"
              docker push "$destination"
            done
          done

  publish-index:
    needs: [stage, publish-architecture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Assemble candidate manifests without rebuilding
        env:
          TAG: ${{ needs.stage.outputs.tag }}
        run: |
          for registry in supercorp/supergateway ghcr.io/supercorp-ai/supergateway; do
            for variant in base uvx deno; do
              suffix="-$variant"; test "$variant" != base || suffix=""
              docker buildx imagetools create -t "$registry:$TAG$suffix" "$registry:$TAG$suffix-amd64" "$registry:$TAG$suffix-arm64"
            done
          done
