name: Published release soak lane

on:
  workflow_call:
    inputs:
      seconds:
        required: true
        type: number
      label:
        required: true
        type: string
      sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  exercise:
    name: ${{ inputs.label }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [windows-latest]
        node: [20, 22, 24, 26]
    env:
      SUPERGATEWAY_SOAK_CONFIRMED: '1'
      SOAK_SECONDS: ${{ inputs.seconds }}
      SOAK_DIRECTORY: .release/overnight
      SOAK_PACKAGE_VERSION: 4.0.0-rc.1
      SOAK_PACKAGE_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify native process enumeration
        run: node --import tsx --test tests/processTree.test.ts
      - name: Install exact published RC and verify its digest
        run: npm exec -- node scripts/install-soak-artifact.mjs
      - name: Exercise published RC
        env:
          PROCESS_TREE_DIAGNOSTICS: .release/overnight/process-snapshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .release/overnight | Out-Null
          $failed = $false
          for ($round = 0; $round -lt 12; $round++) {
            node --import tsx --test --test-concurrency=1 --test-reporter ./scripts/release-test-reporter.mjs tests/modernAutoCompatibility.test.ts tests/modernContinuationBoundary.test.ts 2>&1 | Tee-Object -FilePath ".release/overnight/round-$round.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.label }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .release/overnight/
            .release/public-soak/package-lock.json
            .release/public-soak/artifact.json
          retention-days: 14
          if-no-files-found: warn
