name: Windows full suite (probe)

# Temporary: what the full suite does on Windows, before it joins tests.yaml.
on:
  push:
    branches: [ci/windows-everything]

permissions:
  contents: read

jobs:
  suite:
    name: Windows probe ${{ matrix.shard }}/4 on Node ${{ matrix.node }} / windows-latest
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
        shard: [1, 2, 3, 4]
    env:
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Every test file
        shell: bash
        run: node --import tsx --test --test-concurrency=1 --test-force-exit --test-timeout=240000 --test-shard=${{ matrix.shard }}/4 --experimental-test-module-mocks --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml $(if [ -s .github/windows-probe-files.txt ]; then tr -d '\r' < .github/windows-probe-files.txt; else echo 'tests/**/*.test.ts'; fi)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: junit.xml

  compat:
    name: Windows compat on Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Run npm scripts with bash
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
      - name: Run the version-portable suite
        run: npm run test:compat

  matrix-can-fail:
    name: Windows cleanup matrix fails without the tree kill
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Kill only the shell, as before #335
        shell: bash
        run: |
          node -e "
          const fs = require('fs'), f = 'dist/lib/ownedChildProcesses.js'
          const s = fs.readFileSync(f, 'utf8')
          const from = 'const running = child.exitCode == null && child.signalCode == null;'
          if (!s.includes(from)) throw new Error('mutation site not found')
          fs.writeFileSync(f, s.replace(from, 'child.kill(); const running = false;'))
          "
      - name: The matrix must fail
        shell: bash
        run: |
          if node --import tsx --test --test-concurrency=1 --test-force-exit --test-reporter=spec tests/cleanupMatrixE2e.test.ts > matrix.txt 2>&1; then
            cat matrix.txt; echo 'the matrix passed with only the shell killed'; exit 1
          fi
          grep -E '^(✔|✖)' matrix.txt | sort | uniq -c | sort -rn | head -80

  launcher:
    name: Windows config command found on PATH
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - shell: bash
        run: node --import tsx --test --test-force-exit --test-name-pattern 'launcher script|run without a shell' tests/configFileE2e.test.ts
