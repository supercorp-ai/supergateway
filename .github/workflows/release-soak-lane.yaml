name: Published release soak lane

on:
  workflow_call:
    inputs:
      seconds:
        required: true
        type: number
      label:
        required: true
        type: string
      sha256:
        required: true
        type: string
      # Which macOS jobs run (see release-soak.yaml): "all" is five, "fewer"
      # leaves out Node 22 and 24, and "node20", "node26" and "scenarios" run
      # that one macOS job alone.
      macos:
        type: string
        default: all
      # See release-soak.yaml: false stops a lane at its first failure.
      keep_going:
        type: boolean
        default: false

# Fail fast across the whole run: a job that fails cancels the rest of the
# run (its last step), rather than leaving an hour of other jobs to finish on
# a run nobody will merge or promote. Cancelling needs `actions: write`; on a
# pull request from a fork the token cannot, and the run finishes as before.
permissions:
  contents: read
  actions: write

# Shared by both jobs, so a release still bumps the version in one place here.
env:
  SUPERGATEWAY_SOAK_CONFIRMED: '1'
  SOAK_SECONDS: ${{ inputs.seconds }}
  SOAK_PACKAGE_VERSION: 4.2.1-rc.1
  SOAK_PACKAGE_SHA256: ${{ inputs.sha256 }}
  SOAK_KEEP_GOING: ${{ inputs.keep_going && '1' || '' }}

jobs:
  exercise:
    name: ${{ inputs.label }} / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Five-hour phases, plus install, the finite continuation check, the
    # real-server and Inspector preflight and cooldowns: the hosted maximum.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
        # With "fewer", macOS keeps the oldest and the newest Node here, and
        # Node 24 in the scenarios job below: three macOS jobs, not five.
        # "node20" or "node26" keeps that one here and none below;
        # "scenarios" keeps none here. Linux and Windows always run all four.
        # (Node 0 excludes nothing.)
        exclude: ${{ fromJSON(inputs.macos == 'fewer' && '[{"os":"macos-latest","node":22},{"os":"macos-latest","node":24}]' || inputs.macos == 'node20' && '[{"os":"macos-latest","node":22},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26}]' || inputs.macos == 'node26' && '[{"os":"macos-latest","node":20},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24}]' || inputs.macos == 'scenarios' && '[{"os":"macos-latest","node":20},{"os":"macos-latest","node":22},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26}]' || '[{"os":"macos-latest","node":0}]') }}
    env:
      SOAK_DIRECTORY: .release/overnight
      # Every gateway's whole log, uploaded with the lane's results.
      SOAK_GATEWAY_LOG_DIR: ${{ github.workspace }}/.release/overnight/gateways
      # The scenario soak has runners of its own (the scenarios job below).
      SOAK_SKIP_SCENARIOS: '1'
      # Both 4.0.0 soaks died to a Windows gateway that was still running and
      # had written nothing after eight seconds, on a runner the poll counter
      # showed was being scheduled about five times slower than it asked for,
      # so Windows got room to absorb the stall. Since the scenario soak runs
      # beside the test groups for whole phases, every platform slows the same
      # way: in 4.1.0-rc.0's first phase the direct SDK controls, which involve
      # no gateway, took 3-4x their canary time on macOS and up to 3.7x on
      # Linux, and a fixed 3 s probe budget failed there. The soak looks for
      # leaks, crashes and hangs over hours, not latency, so every lane gets
      # the same room; a hang still fails, and the readiness failure still
      # reports how long the gateway took and how badly it was scheduled.
      # Group and request timeouts follow it through gatewayTimeout() and
      # requestTimeout().
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
      # Real, pinned MCP servers from npm and PyPI (scripts/realServers.test.ts),
      # on every platform: through the gateway each starts in its shell, sh or
      # cmd.exe.
      SUPERGATEWAY_REAL_SERVERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify native process enumeration
        run: node --import tsx --test tests/processTree.test.ts
      - name: Install exact published RC and verify its digest
        run: npm exec -- node scripts/install-soak-artifact.mjs
      - name: Set up uv for the Python servers
        uses: astral-sh/setup-uv@v6
      # Downloads and caches the pinned servers and Inspector before the clock
      # starts, and fails fast if a registry is down or a server misbehaves
      # rather than after hours of soak.
      - name: Real servers and the Inspector agree through every gateway path
        timeout-minutes: 45
        run: node --import tsx --test --test-concurrency=1 scripts/realServers.test.ts scripts/inspectorClient.test.ts
      - name: Exercise published RC
        run: node scripts/overnight-release.mjs
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.label }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            .release/overnight/
            .release/public-soak/package-lock.json
            .release/public-soak/artifact.json
          retention-days: 14
          if-no-files-found: warn
      - name: Stop the rest of the run (this job failed)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The exercise lanes run only the Node battery driver. This job keeps the
  # Python and Go SDKs and the Ruby client talking to the same candidate for the
  # whole phase, through every output transport. The toolchains and client
  # versions are the ones the cross-client CI job pins (tests.yaml).
  languages:
    name: ${{ inputs.label }} / Python, Go and Ruby clients / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SOAK_DIRECTORY: .release/languages
    # The same commands on both: Windows runs them in Git Bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install exact published RC and verify its digest
        run: npm exec -- node scripts/install-soak-artifact.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the Python MCP client
        run: pip install 'mcp==2.2.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build the Go driver
        run: |
          mkdir -p "$RUNNER_TEMP/gobattery"
          cp tests/clients/battery.go "$RUNNER_TEMP/gobattery/main.go"
          cd "$RUNNER_TEMP/gobattery"
          go mod init battery
          go get github.com/modelcontextprotocol/go-sdk@v0.2.0
          go mod tidy
          go build -o "$RUNNER_TEMP/go-battery$([ "$RUNNER_OS" = Windows ] && echo .exe)" .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the Ruby MCP client
        run: gem install ruby-mcp-client -v 2.1.0
      # Each driver as its interpreter and script, not a #! wrapper, which
      # Windows cannot run.
      - name: Exercise published RC with the Python, Go and Ruby clients
        run: node scripts/soak-languages.mjs
        env:
          SOAK_BATTERY_PYTHON: '["python", "tests/clients/battery.py"]'
          SOAK_BATTERY_GO: ${{ runner.temp }}/go-battery${{ runner.os == 'Windows' && '.exe' || '' }}
          SOAK_BATTERY_RUBY: '["ruby", "tests/clients/battery.rb"]'
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.label }}-languages-${{ matrix.os }}
          path: .release/languages/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop the rest of the run (this job failed)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # The scenario soak (scripts/soak-scenarios.test.ts) for the whole phase, on
  # runners of its own. Beside the test groups it starved them: in the
  # 4.1.0-rc.0 soak the groups ran 2.5x slower on average and up to 11x, and
  # timing-bound tests failed on macOS that pass alone. It keeps its own
  # resource gates here, on Linux, Windows and (with a free macOS slot) macOS.
  scenarios:
    name: ${{ inputs.label }} / scenarios / Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # On macOS unless the phase's one macOS job is a Node lane above.
        os: ${{ fromJSON((inputs.macos == 'node20' || inputs.macos == 'node26') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    env:
      SOAK_DIRECTORY: .release/scenarios
      SOAK_GATEWAY_LOG_DIR: ${{ github.workspace }}/.release/scenarios/gateways
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install exact published RC and verify its digest
        run: npm exec -- node scripts/install-soak-artifact.mjs
      - name: Scenario soak against the published RC
        run: |
          mkdir -p "$SOAK_DIRECTORY"
          node --import tsx --test scripts/soak-scenarios.test.ts 2>&1 | tee "$SOAK_DIRECTORY/scenarios.log"
          exit "${PIPESTATUS[0]}"
        shell: bash
        env:
          SOAK_REPORT: ${{ github.workspace }}/.release/scenarios/scenarios.jsonl
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-${{ inputs.label }}-scenarios-${{ matrix.os }}
          path: .release/scenarios/
          retention-days: 14
          if-no-files-found: warn
      - name: Stop the rest of the run (this job failed)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
