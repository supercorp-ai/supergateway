name: Windows taskkill probe

# Temporary: whether ending servers with taskkill /T orphans servers or ends
# processes that are not the gateway's, under soak-like churn.
on:
  push:
    branches: [probe/windows-taskkill]

permissions:
  contents: read

jobs:
  probe:
    name: Windows process tree under churn, 60 minutes
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node .github/experiments/tree-probe.mjs
        env:
          PROBE_MINUTES: '60'
