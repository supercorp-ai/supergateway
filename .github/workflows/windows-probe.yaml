name: Windows full suite (probe)

# Temporary: what the full suite does on Windows, before it joins tests.yaml.
on:
  push:
    branches: [ci/windows-everything]

permissions:
  contents: read

jobs:
  suite:
    name: Windows probe ${{ matrix.shard }}/4 on Node ${{ matrix.node }} / windows-latest
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
        shard: [1, 2, 3, 4]
    env:
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Every test file
        shell: bash
        run: node --import tsx --test --test-concurrency=1 --test-force-exit --test-timeout=240000 --test-shard=${{ matrix.shard }}/4 --experimental-test-module-mocks --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml $(if [ -s .github/windows-probe-files.txt ]; then cat .github/windows-probe-files.txt; else echo 'tests/**/*.test.ts'; fi)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: junit.xml
