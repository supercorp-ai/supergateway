name: Windows runner health probe

# Temporary: what the soak's scenarios and language-client workloads do to a
# Windows runner over hours. Two runners running them died ("lost
# communication") 4 h 55 min into a soak phase, taking their logs with them,
# so this samples the machine every minute and stops at 2.5 hours.
on:
  push:
    branches: [probe/windows-runner-health]

permissions:
  contents: read

jobs:
  probe:
    name: Windows ${{ matrix.workload }} for 2.5 hours, sampled
    runs-on: windows-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        workload: [exercise]
    defaults:
      run:
        shell: bash
    env:
      SUPERGATEWAY_SOAK_CONFIRMED: '1'
      SOAK_SECONDS: '9000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - if: matrix.workload == 'exercise'
        name: Install exact published RC and verify its digest
        run: npm exec -- node scripts/install-soak-artifact.mjs
        env:
          SOAK_PACKAGE_VERSION: 4.2.1-rc.1
          SOAK_PACKAGE_SHA256: a27956327b6016692f03e2cf8df4b1405b00ee4296cd1cc55f4b2fe57c2ef756
      - if: matrix.workload == 'exercise'
        uses: astral-sh/setup-uv@v6
      - if: matrix.workload == 'languages'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: matrix.workload == 'languages'
        run: pip install 'mcp==2.2.0'
      - if: matrix.workload == 'languages'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - if: matrix.workload == 'languages'
        run: |
          mkdir -p "$RUNNER_TEMP/gobattery"
          cp tests/clients/battery.go "$RUNNER_TEMP/gobattery/main.go"
          cd "$RUNNER_TEMP/gobattery"
          go mod init battery
          go get github.com/modelcontextprotocol/go-sdk@v0.2.0
          go mod tidy
          go build -o "$RUNNER_TEMP/go-battery.exe" .
      - if: matrix.workload == 'languages'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: matrix.workload == 'languages'
        run: gem install ruby-mcp-client -v 2.1.0
      - name: Workload, with the machine sampled every minute
        timeout-minutes: 175
        env:
          SOAK_BATTERY_PYTHON: '["python", "tests/clients/battery.py"]'
          SOAK_BATTERY_GO: ${{ runner.temp }}/go-battery.exe
          SOAK_BATTERY_RUBY: '["ruby", "tests/clients/battery.rb"]'
          SOAK_REPORT: .release/${{ matrix.workload }}.jsonl
          SOAK_DIRECTORY: .release/languages
        run: |
          mkdir -p .release
          sample() {
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command '
              $os = Get-CimInstance Win32_OperatingSystem
              $p = Get-Process
              $count = { param($n) @($p | Where-Object { $_.ProcessName -eq $n }).Count }
              $disk = Get-PSDrive D
              "HEALTH {0} freeMB={1} commitMB={2} commitLimitMB={3} procs={4} handles={5} node={6} cmd={7} conhost={8} python={9} ruby={10} go={11} powershell={12} diskFreeGB={13}" -f (Get-Date -Format "HH:mm:ss"), [int]($os.FreePhysicalMemory/1024), [int](($os.TotalVirtualMemorySize-$os.FreeVirtualMemory)/1024), [int]($os.TotalVirtualMemorySize/1024), $p.Count, ($p | Measure-Object HandleCount -Sum).Sum, (& $count node), (& $count cmd), (& $count conhost), (& $count python), (& $count ruby), (& $count go-battery), (& $count powershell), [int]($disk.Free/1GB)
            ' 2>&1 | tr -d '\r'
          }
          ( while true; do sample; sleep 60; done ) &
          sampler=$!
          status=0
          if [ '${{ matrix.workload }}' = exercise ]; then
            SOAK_DIRECTORY=.release/overnight SOAK_SKIP_SCENARIOS=1 SUPERGATEWAY_REAL_SERVERS=1 SUPERGATEWAY_TEST_READY_TIMEOUT=30000 SOAK_PACKAGE_VERSION=4.2.1-rc.1 SOAK_PACKAGE_SHA256=a27956327b6016692f03e2cf8df4b1405b00ee4296cd1cc55f4b2fe57c2ef756 node scripts/overnight-release.mjs > .release/workload.log 2>&1 || status=$?
          elif [ '${{ matrix.workload }}' = scenarios ]; then
            SUPERGATEWAY_TEST_ENTRY=dist/index.js node --import tsx --test scripts/soak-scenarios.test.ts > .release/workload.log 2>&1 || status=$?
          else
            SUPERGATEWAY_TEST_ENTRY=dist/index.js node scripts/soak-languages.mjs > .release/workload.log 2>&1 || status=$?
          fi
          kill $sampler 2>/dev/null
          sample
          echo "WORKLOAD EXIT $status"
          tail -40 .release/workload.log
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-health-${{ matrix.workload }}
          path: .release/
          include-hidden-files: true
