name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # The full suite needs Node 24: it relies on the test runner's module mocking,
  # which behaves differently on 20 and 22 (see the smoke job for what older
  # versions are actually checked for). macOS is here because the suite ran only
  # on a developer's Mac until GW-015 showed what a single untested platform
  # hides — this keeps both directions covered.
  test:
    name: Suite on Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # `pretest` compiles first: over half the suite spawns dist/index.js, so a
      # stale build would let the compiled CLI tests pass against old code.
      - name: Run tests
        timeout-minutes: 6
        run: npm test
        env:
          # The ts-node typechecking loader aborts every file on Node 24.
          TS_NODE_TRANSPILE_ONLY: 'true'

  # Ten seconds, and it found nine real defects the suite never did — the three
  # `transport.send()` crashes users reported, three `transport.close()` calls
  # nobody had noticed in the cleanup paths, the two async handlers that turn a
  # thrown TypeError into an unhandled rejection, and a floating `main()`.
  #
  # Blocking as of cluster A, which cleared all nine. The tenth finding is a
  # declaration artifact and carries an inline disable explaining why: Express 4
  # types its Application as returning `void | Promise<void>`, while the runtime
  # app is a plain three-argument synchronous function.
  #
  # Every rule here catches the same class of defect — an async call in a
  # synchronous context, with nothing holding the rejection — which on Node is
  # not an error but an immediate process exit.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        timeout-minutes: 3
        run: npm run lint

  # Every structural coverage metric is at 100% as of 2026-09-15, and this is
  # what keeps it there. Without a gate the number only moves one way: a change
  # adds an obligation, the percentage slips a little, and nobody is obliged to
  # notice. Every defect in the backlog hid in a path no test exercised.
  #
  # It is not redundant with the suite. Calibrated by adding one unreachable
  # function to `src/`: the suite stayed green at 151 passing, and this check
  # went red on every metric, naming the file and its uncovered lines.
  #
  # `--per-file` is the part worth keeping. An aggregate floor lets one file rot
  # while the rest carries it; per-file, the failure above reported
  # `src/lib/getVersion.ts: mcdc 0.00% 0/1` rather than a run-wide 99.28%.
  #
  # Floors are compared against counts rather than a rounded percentage, so
  # 9,999 of 10,000 lines fails a 100% floor instead of displaying as 100% and
  # passing. `check` also ends with 2, not 0, when it cannot answer — a stale
  # run, a failed test command, an unmeasured metric — so a gate can never turn
  # a red run green.
  #
  # MC/DC is gated rather than left advisory because it is the only metric that
  # has ever predicted anything here. Against six condition-level mutants, every
  # condition it flagged had a surviving mutant, while lines and assertion
  # coverage — both at 100% — distinguished none of them.
  #
  # Assertion coverage is deliberately absent: it needs the authored map in
  # `.supercov/`, which self-ignores and is not in the repository, so this job
  # has nothing to measure it against. It has its own check
  # (`runs <id> assertions check`) for when the map has somewhere to live; until
  # then it is measured locally and quoted in the pull request.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Over half the suite spawns dist/index.js; measuring a stale build would
      # report coverage of code this commit does not contain.
      - name: Build
        run: npm run build
      - name: Measure coverage
        timeout-minutes: 10
        run: npx -y supercov@0.0.53 -- node --import tsx --test --test-concurrency=1 --experimental-test-module-mocks 'tests/**/*.test.ts'
        env:
          TS_NODE_TRANSPILE_ONLY: 'true'
      - name: Enforce 100%
        run: >-
          npx -y supercov@0.0.53 runs check --per-file
          --min-lines 100 --min-statements 100 --min-functions 100
          --min-branches 100 --min-mcdc 100

  # Every other test here speaks to the gateway through the Node SDK — the same
  # implementation the gateway itself uses — which makes a whole class of defect
  # invisible. The gateway can emit bytes that are perfectly valid by its own
  # reader's rules and unreadable to somebody else's.
  #
  # Issue #91 is the example: a tool result carrying U+2028 is legal JSON and a
  # legal SSE frame, since the stream is split on CR and LF only, but a consumer
  # that splits by Unicode line-terminator semantics cuts the JSON mid-string.
  # No Node client can tell us whether that happens.
  #
  # Calibrated against the fix proposed in PR #93: applying its
  # `sanitizeJsonObject` at the send site makes this job fail with
  # `received 'before\\u2028middle...'` — the client gets the escape as literal
  # text. That is a real second implementation catching a real regression, which
  # no unit test in this repository could have shown.
  #
  # Three drivers now run the same thirteen-scenario battery against all three
  # output transports, so the result is a matrix: a cell that differs between
  # languages is a disagreement between implementations rather than a gateway
  # defect. Ruby and Rust drivers exist too and agree; they are left out of CI
  # only to keep the toolchain list short.
  #
  # The battery deliberately runs below 1 MiB. At or above that a single SSE
  # event is refused by the Python and Go clients, accepted by TypeScript, and
  # capped at 16 MiB by Rust — four SDKs, four answers. That is GW-023, a
  # specification gap rather than a regression, and not this job's business.
  python-client:
    name: Cross-client battery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Pinned: this job exists to detect disagreement between implementations,
      # so the other implementation must not drift underneath it silently.
      - name: Install the Python MCP client
        run: pip install 'mcp==2.2.0'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Built here rather than committed: pinning the SDK version on the command
      # line is enough, and it keeps Go module files out of a TypeScript repo.
      - name: Build the Go driver
        run: |
          mkdir -p "$RUNNER_TEMP/gobattery"
          cp tests/clients/battery.go "$RUNNER_TEMP/gobattery/main.go"
          cd "$RUNNER_TEMP/gobattery"
          go mod init battery
          go get github.com/modelcontextprotocol/go-sdk@v0.2.0
          # `go get` records the module but not the checksums of what it
          # imports, and the build refuses to proceed without them. `tidy` keeps
          # the version pinned on the line above and only fills in the sums.
          go mod tidy
          go build -o "$RUNNER_TEMP/go-battery" .
      - name: Conformance battery — Node
        timeout-minutes: 6
        run: node tests/clients/run-battery.mjs node
      - name: Conformance battery — Python
        timeout-minutes: 6
        run: |
          printf '#!/bin/sh\nexec python "%s/tests/clients/battery.py" "$@"\n' "$PWD" > "$RUNNER_TEMP/pybattery"
          chmod +x "$RUNNER_TEMP/pybattery"
          node tests/clients/run-battery.mjs python "$RUNNER_TEMP/pybattery"
      - name: Conformance battery — Go
        timeout-minutes: 6
        run: node tests/clients/run-battery.mjs go "$RUNNER_TEMP/go-battery"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # A community client rather than an official SDK, and the only driver here
      # that is not one: it is what a Ruby user would actually reach for, and it
      # makes its own parsing choices.
      - name: Install the Ruby MCP client
        run: gem install ruby-mcp-client -v 2.1.0
      - name: Conformance battery — Ruby
        timeout-minutes: 6
        run: |
          printf '#!/bin/sh\nexec ruby "%s/tests/clients/battery.rb" "$@"\n' "$PWD" > "$RUNNER_TEMP/rbbattery"
          chmod +x "$RUNNER_TEMP/rbbattery"
          node tests/clients/run-battery.mjs ruby "$RUNNER_TEMP/rbbattery"

  # The gateway's behaviour *is* the SDK's behaviour, and the lockfile pins one
  # version while `^1.18.2` lets consumers resolve anything up to the latest.
  # Cluster C exists only above our pin, so no test written against the lockfile
  # could ever have found it. One job per minor line means a failure also says
  # which release introduced it.
  #
  # The range spans two purposes, and a green column does not mean the same thing
  # at both ends.
  #
  #   >= 1.26  the versions worth depending on. Everything below carries three
  #            high-severity advisories, including a cross-client data leak via
  #            shared server/transport reuse (GHSA-345p-7cg4-v4c7), which is the
  #            pattern stdioToSse.ts uses.
  #   <  1.26  kept deliberately, as a regression record. Testing a version is
  #            not endorsing it: these columns are the only thing that will say
  #            whether a fix written for 1.26 broke behaviour that worked before,
  #            and the fixes ahead touch code every version exercises. A green
  #            column here means "this still works", not "this is safe to run".
  #
  # Blocking, as of the lockdown: the whole range passes, so a red column now
  # means something new rather than something known. Be careful reading that
  # green, though — it rests on three different things. 1.18-1.24 passes because
  # it works. 1.25-1.26 passes because one test is marked as an upstream
  # regression, and that marker fails loudly if the SDK ever fixes it. 1.27-1.30
  # passes because GW-017 is held as a TODO with a reproducer rather than
  # enforced. Only the first is a clean bill of health.
  #
  # See SDK-SECURITY.md and SDK-SUPPORT.md in supergateway-company.
  sdk:
    name: SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - '1.18.2'
          - '1.19.1'
          - '1.20.2'
          - '1.21.2'
          - '1.22.0'
          - '1.23.1'
          - '1.24.3'
          - '1.25.3'
          - '1.26.0'
          - '1.27.1'
          - '1.28.0'
          - '1.29.0'
          - '1.30.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the SDK under test
        run: npm install --no-save @modelcontextprotocol/sdk@${{ matrix.sdk }}
      - name: Run tests
        timeout-minutes: 6
        run: npm test
        env:
          TS_NODE_TRANSPILE_ONLY: 'true'

  # Every Node version the package is actually run on, with real tests rather
  # than a smoke check. Only the files needing the runner's module mocking are
  # left out: that API is experimental and behaves differently on 18, 20 and 22,
  # for reasons that have nothing to do with this gateway. Everything else runs,
  # including every end-to-end test that spawns the compiled CLI - which is the
  # part that catches platform differences, as GW-015 showed.
  compat:
    name: Compatible suite on Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the version-portable suite
        timeout-minutes: 6
        run: npm run test:compat

  # The libc the shipped image actually uses. The compat job covers glibc and
  # darwin; this covers musl, and checks that the compiled gateway starts,
  # announces its listener and serves a request there.
  smoke:
    name: Built gateway starts on Node ${{ matrix.node }} (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Built once with a toolchain known to work, then run under each target.
      # The runtime dependencies are all pure JavaScript, so the same tree runs
      # unchanged on musl. Docker is used rather than a job `container:` because
      # actions/checkout needs a glibc runtime that Alpine does not provide.
      - name: Install dependencies and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Start the gateway and serve a request
        timeout-minutes: 4
        run: |
          docker run --rm -v "$PWD":/app:ro -w /app \
            node:${{ matrix.node }}-alpine sh -eu -c '
              node --version
              node dist/index.js \
                --stdio "node tests/helpers/mock-mcp-server.js stdio" \
                --port 8123 > /tmp/gateway.log 2>&1 &
              for _ in $(seq 1 30); do
                grep -q "Listening on port" /tmp/gateway.log && break
                sleep 1
              done
              if ! grep -q "Listening on port" /tmp/gateway.log; then
                echo "The gateway never announced its listener:"
                cat /tmp/gateway.log
                exit 1
              fi
              if ! timeout 5 wget -q -S -O /dev/null http://127.0.0.1:8123/sse 2>&1 |
                  grep -q "200 OK"; then
                echo "The SSE endpoint did not answer 200:"
                cat /tmp/gateway.log
                exit 1
              fi
              echo "started and served the SSE endpoint"
            '

  # The three published images are a shipping surface nothing else checks. The
  # publish workflow builds and pushes them without asserting anything about
  # what came out, which is how `:deno` came to contain no Deno (GW-024).
  #
  # Not part of `npm test`: building three images takes minutes, and none of it
  # depends on the working tree the way the suite does.
  docker:
    name: Published images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check the images
        timeout-minutes: 18
        env:
          RUN_DOCKER_TESTS: '1'
        run: npx tsx --test tests/dockerImages.test.ts
