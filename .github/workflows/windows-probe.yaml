name: Windows full suite (probe)

# Temporary: what the full suite does on Windows, before it joins tests.yaml.
on:
  push:
    branches: [ci/windows-everything]

permissions:
  contents: read

jobs:
  matrix-can-fail:
    name: Windows cleanup matrix fails without the tree kill
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - name: Kill only the shell, as before #335
        shell: bash
        run: |
          node -e "
          const fs = require('fs'), f = 'dist/lib/ownedChildProcesses.js'
          const s = fs.readFileSync(f, 'utf8')
          const from = 'const running = child.exitCode == null && child.signalCode == null;'
          if (!s.includes(from)) throw new Error('mutation site not found')
          fs.writeFileSync(f, s.replace(from, 'child.kill(); const running = false;'))
          "
      - name: The matrix must fail
        shell: bash
        run: |
          set -o pipefail
          if node --import tsx --test --test-concurrency=4 --test-force-exit --test-reporter=spec tests/cleanupMatrixE2e.test.ts 2>&1 | grep -E --line-buffered '^(✔|✖)|^ℹ (pass|fail)'; then
            echo 'the matrix passed with only the shell killed'; exit 1
          fi

