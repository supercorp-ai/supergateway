name: Windows real servers probe

# Temporary: the soak's real servers, Inspector and language clients on
# Windows, before a soak depends on them.
on:
  push:
    branches: [ci/windows-soak]

permissions:
  contents: read

jobs:
  real-servers:
    name: Windows real servers and the Inspector
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SUPERGATEWAY_REAL_SERVERS: '1'
      SUPERGATEWAY_TEST_READY_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Real servers and the Inspector agree through every gateway path
        timeout-minutes: 45
        run: node --import tsx --test --test-concurrency=1 scripts/realServers.test.ts scripts/inspectorClient.test.ts

  languages:
    name: Windows language clients, short soak
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SOAK_DIRECTORY: .release/languages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'mcp==2.2.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build the Go driver
        run: |
          mkdir -p "$RUNNER_TEMP/gobattery"
          cp tests/clients/battery.go "$RUNNER_TEMP/gobattery/main.go"
          cd "$RUNNER_TEMP/gobattery"
          go mod init battery
          go get github.com/modelcontextprotocol/go-sdk@v0.2.0
          go mod tidy
          go build -o "$RUNNER_TEMP/go-battery.exe" .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install ruby-mcp-client -v 2.1.0
      - name: Language clients for two minutes
        run: node scripts/soak-languages.mjs
        env:
          SUPERGATEWAY_SOAK_CONFIRMED: '1'
          SOAK_SECONDS: '120'
          SUPERGATEWAY_TEST_ENTRY: dist/index.js
          SOAK_BATTERY_PYTHON: '["python", "tests/clients/battery.py"]'
          SOAK_BATTERY_GO: ${{ runner.temp }}/go-battery.exe
          SOAK_BATTERY_RUBY: '["ruby", "tests/clients/battery.rb"]'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-languages
          path: .release/languages/
          include-hidden-files: true
