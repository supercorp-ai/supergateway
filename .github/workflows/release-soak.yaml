name: Published release soak

on:
  workflow_dispatch:
    inputs:
      sha256:
        description: Verified SHA-256 of the published 4.1.0 tarball
        required: true
        type: string
      duration:
        description: Run canaries only, the six-hour campaign, or the 25-hour one
        type: choice
        options: [canary, six-hours, twenty-five-hours]
        default: canary

permissions:
  contents: read

jobs:
  canary:
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 60
      label: canary
      sha256: ${{ inputs.sha256 }}

  first:
    needs: canary
    if: inputs.duration != 'canary'
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: first-three-hours
      sha256: ${{ inputs.sha256 }}

  second:
    needs: [canary, first]
    if: ${{ !cancelled() && inputs.duration != 'canary' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: second-three-hours
      sha256: ${{ inputs.sha256 }}

  # The 25-hour campaign continues from the six-hour one, one phase after
  # another, because a hosted job runs at most six hours. A phase runs whether
  # or not the one before it passed: one flaky test used to stop every later
  # phase and throw away the rest of the campaign. Each failure still fails the
  # campaign (see verdict), and `gh run rerun --failed` reruns only the lanes
  # that failed.
  third:
    needs: [canary, second]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: hours-6-to-9
      sha256: ${{ inputs.sha256 }}

  fourth:
    needs: [canary, third]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: hours-9-to-12
      sha256: ${{ inputs.sha256 }}

  fifth:
    needs: [canary, fourth]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: hours-12-to-15
      sha256: ${{ inputs.sha256 }}

  sixth:
    needs: [canary, fifth]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: hours-15-to-18
      sha256: ${{ inputs.sha256 }}

  seventh:
    needs: [canary, sixth]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: hours-18-to-21
      sha256: ${{ inputs.sha256 }}

  eighth:
    needs: [canary, seventh]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 10800
      label: hours-21-to-24
      sha256: ${{ inputs.sha256 }}

  ninth:
    needs: [canary, eighth]
    if: ${{ !cancelled() && inputs.duration == 'twenty-five-hours' && needs.canary.result == 'success' }}
    uses: ./.github/workflows/release-soak-lane.yaml
    with:
      seconds: 3600
      label: hour-24-to-25
      sha256: ${{ inputs.sha256 }}

  # Phases no longer depend on each other's success, so the campaign's result
  # is here: it fails if any phase failed or was cancelled, and lists them.
  verdict:
    needs: [canary, first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Every phase that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/soak-verdict.mjs
